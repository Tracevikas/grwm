<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GRWM is offline</title>
    <style>
      :root { color-scheme: light; --bg: #f6f3fb; --fg: #3b3a4a; --muted: #8b8a9c; --accent: linear-gradient(135deg, #b8a4e8, #f0aecb); }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: var(--bg) linear-gradient(150deg, #f1ecfb 0%, #fbf0f5 55%, #edf7f2 100%); color: var(--fg); text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .mirror { width: 96px; aspect-ratio: 3 / 4; margin: 0 auto 24px; border-radius: 999px 999px 18px 18px; background: var(--accent); }
      h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: -0.02em; }
      p { margin: 0 auto 24px; max-width: 18rem; color: var(--muted); line-height: 1.5; }
      button {
        height: 48px; padding: 0 24px; border: 0; border-radius: 999px; font: inherit; font-weight: 600;
        background: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 6px 16px -6px #a78bd0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mirror" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>Your wardrobe needs a connection. Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
